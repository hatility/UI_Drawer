name: 다크 패턴 사례 알리기
description: 실제 서비스에서 본 다크 패턴을 알려 주세요 (개인 정보는 가려 주세요)
title: "[다크 패턴 사례] "
labels: ["다크 패턴"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 어떤 패턴인가요?
      options: [컨펌셰이밍, 거짓 긴급성, 기본 선택 함정, 로치 모텔, 숨은 비용, 위장 광고, 가짜 닫기 버튼, 쿠키 벽, 빨간 점 남발, 잘 모르겠어요]
  - type: textarea
    id: what
    attributes: { label: 어떤 화면이었나요?, placeholder: "무엇을 하려는데 어떻게 막혔는지" }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: 어디서 봤나요?, placeholder: "앱 · 사이트 종류 (회사 이름은 빼도 돼요)" }
