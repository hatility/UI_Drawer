server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;

  # 기본 보안 헤더 (location 안에서 add_header 를 쓰면 빠지므로 아래에서는 expires 만 써요)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # 파일명에 해시가 붙은 정적 파일은 오래 캐시
  location /assets/ { expires 1y; }
  # index.html 은 늘 새로 받아 새 버전이 바로 보이게
  location = /index.html { expires -1; }
  # 주소는 #/ 방식이라 서버 길찾기가 필요 없지만, 없는 주소는 첫 화면으로
  location / { try_files $uri $uri/ /index.html; }
}
